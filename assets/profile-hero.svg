<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Build what matters</title>
  <desc id="desc">Mikesoft-inspired profile banner for Michael Gasperini, focused on product engineering, developer experience, and open source.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14" />
      <stop offset="0.55" stop-color="#0D1830" />
      <stop offset="1" stop-color="#102A3E" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8" />
      <stop offset="0.55" stop-color="#2563EB" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.34" />
      <stop offset="1" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.06" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1000" height="300" rx="28" fill="url(#background)" />
  <rect width="1000" height="300" rx="28" fill="url(#grid)" />
  <circle cx="205" cy="145" r="190" fill="url(#glow)" />
  <circle cx="925" cy="34" r="118" fill="url(#glow)" opacity="0.5" />
  <path d="M 350 58 H 906" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="930" cy="58" r="5" fill="#22D3EE" />

  <g transform="translate(70 48) skewX(-9)" filter="url(#shadow)" aria-hidden="true">
    <rect x="0" y="0" width="142" height="92" rx="18" fill="url(#tile)" stroke="#BAE6FD" stroke-width="2" />
    <rect x="158" y="25" width="78" height="67" rx="16" fill="url(#tile)" stroke="#BAE6FD" stroke-width="2" />
    <rect x="14" y="110" width="78" height="65" rx="16" fill="url(#tile)" stroke="#BAE6FD" stroke-width="2" />
    <rect x="108" y="110" width="142" height="92" rx="18" fill="url(#tile)" stroke="#BAE6FD" stroke-width="2" />
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="350" y="116" fill="#F8FAFC" font-size="50" font-weight="750" letter-spacing="-1.5">BUILD WHAT MATTERS.</text>
    <text x="350" y="158" fill="#BAE6FD" font-size="22" font-weight="650" letter-spacing="2.4">PRODUCT ENGINEERING · DEVELOPER EXPERIENCE</text>
    <text x="350" y="194" fill="#BAE6FD" font-size="22" font-weight="650" letter-spacing="2.4">OPEN SOURCE · REAL OWNERSHIP</text>
    <text x="350" y="247" fill="#94A3B8" font-size="18" font-weight="500">Useful software, shaped around real work.</text>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="27.25" fill="none" stroke="#60A5FA" stroke-opacity="0.24" stroke-width="1.5" />
</svg>
