<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
  <title id="title">Build what matters</title>
  <desc id="desc">Profile statement for Michael Gasperini, focused on product engineering, developer experience, open source, and real ownership.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14" />
      <stop offset="0.55" stop-color="#0D1830" />
      <stop offset="1" stop-color="#102A3E" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.34" />
      <stop offset="1" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1000" height="210" rx="28" fill="url(#background)" />
  <rect width="1000" height="210" rx="28" fill="url(#grid)" />
  <circle cx="70" cy="178" r="190" fill="url(#glow)" opacity="0.55" />
  <circle cx="925" cy="34" r="118" fill="url(#glow)" opacity="0.5" />
  <path d="M 160 38 H 840" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.72" />
  <circle cx="140" cy="38" r="5" fill="#60A5FA" />
  <circle cx="860" cy="38" r="5" fill="#22D3EE" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="500" y="100" fill="#F8FAFC" font-size="48" font-weight="750" letter-spacing="-1.4">BUILD WHAT MATTERS.</text>
    <text x="500" y="139" fill="#BAE6FD" font-size="20" font-weight="650" letter-spacing="2.2">PRODUCT ENGINEERING · DEVELOPER EXPERIENCE · OPEN SOURCE</text>
    <text x="500" y="174" fill="#94A3B8" font-size="18" font-weight="550" letter-spacing="1.1">USEFUL SOFTWARE · REAL OWNERSHIP</text>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="208.5" rx="27.25" fill="none" stroke="#60A5FA" stroke-opacity="0.24" stroke-width="1.5" />
</svg>
